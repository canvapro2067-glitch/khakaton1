services:
  - type: web
    name: moloko-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        value: sqlite:////tmp/moloko.db
    autoDeploy: true