services:
  - type: web
    name: moloko-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/moloko.db
      - key: SKIP_STARTUP_SOLVE
        value: "1"
      - key: PYTHONPATH
        value: /app
    autoDeploy: true